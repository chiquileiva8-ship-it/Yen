    <style>
        :root {

            --light: #F8F9FA;
            --danger: #EF476F;

        body {

            background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .story-card {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 30px;
            text-align: center;
            position: relative;
            border: 6px solid white;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F1F5F9;
            padding: 8px 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            font-family: 'Fredoka One', cursive;
        }

        .hearts { color: var(--danger); font-size: 1.1rem; }
        .level-indicator { background: var(--secondary); color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; }

        .help-btn {
            background: var(--accent);
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            color: #7A5C00;
            box-shadow: 0 2px 0 #d4bc43;
        }
        .help-btn:active { transform: translateY(2px); box-shadow: none; }

        .chapter-tag {
            display: inline-block;
            background: var(--accent);
            color: #7A5C00;
            padding: 3px 12px;
            border-radius: 15px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px rgba(255, 209, 102, 0.5);
        }

        .emoji-art { font-size: 3.2rem; margin: 4px 0; animation: bounce 2s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .story-text {
            font-size: 0.98rem;
            line-height: 1.5;
            margin: 10px 0;
            font-weight: 700;
            color: #4A5568;
            text-align: justify;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .decision-box {
            background: #FFF9E6;
            border-left: 5px solid var(--accent);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin: 10px 0;
            color: #5C4300;
            text-align: left;
            font-weight: 700;
        }

        .hint-box {
            background: var(--owl-bg);
            border-left: 5px solid #00ACC1;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin: 8px 0;
            color: #006064;
            display: none;
            text-align: left;
            font-weight: 700;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;

            box-shadow: 0 4px 0 #2082d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;

        .btn-success:hover { background-color: #05b888; box-shadow: 0 6px 0 #037556; }

            margin: 8px 0;

            border-radius: 10px;

            box-sizing: border-box;

</head>

            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'click') {
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hurt') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.start(); osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function renderScene(sceneKey, damage = 0) {
            if (sceneKey === 'reiniciar') {
                vidas = 3;
                historialDecisiones = [];
                renderScene('test_inicial', 0);
                return;
            }

            vidas -= damage;
            if (vidas <= 0) {
                sceneKey = 'game_over';
                vidas = 0;
            }

            const scene = story[sceneKey];
            const app = document.getElementById('app');

            // Registrar decisión si es un nivel de juego
            if(sceneKey !== 'test_inicial' && sceneKey !== 'test_q2' && sceneKey !== 'pantalla_reflexion' && sceneKey !== 'game_over') {
                historialDecisiones.push(`Nivel ${scene.level}: ${scene.title}`);
            }

            let heartsHTML = '❤️'.repeat(vidas) + '🤍'.repeat(3 - vidas);

            let buttonsHTML = '';
            scene.options.forEach(opt => {
                let btnClass = 'btn ' + (opt.style || '');
                buttonsHTML += `<button class="${btnClass}" onclick="playSound('${opt.sound}'); renderScene('${opt.next}', ${opt.damage || 0})">${opt.text}</button>`;
            });

            // Interfaz especial para la pantalla de reflexión final con historial
            let textoExtra = scene.text;
            if(sceneKey === 'pantalla_reflexion') {
                textoExtra += `<br><br><b>Tus decisiones en el camino (${historialDecisiones.length} elecciones tomadas):</b><br>` + historialDecisiones.slice(-5).join(' ➔ ');
            }

            let hudHTML = '';
            if(sceneKey !== 'test_inicial' && sceneKey !== 'test_q2') {
                hudHTML = `
                    <div class="hud">
                        <div class="hearts">Vidas: ${heartsHTML}</div>
                        <div class="level-indicator">Nivel ${scene.level} / 20</div>
                        <button class="help-btn" onclick="toggleHint()">🦉 Ayuda del Búho</button>
                    </div>
                `;
            }

            app.innerHTML = `
                ${hudHTML}
                <div class="chapter-tag">${scene.tag}</div>
                <h1>${scene.title}</h1>
                <div class="emoji-art">${scene.emoji}</div>
                <div class="story-text">${textoExtra}</div>
                <div class="hint-box" id="hint-box">${scene.hint}</div>
                <div class="decision-box">${scene.question}</div>
                <div class="btn-grid">
                    ${buttonsHTML}
                </div>
            `;
        }

        // Iniciar en el Test Inicial
        renderScene('test_inicial', 0);
    </script>
