<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Gran Desafío: La Liebre y la Tortuga</title>
    <!-- Fuentes infantiles amigables -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5964;
            --secondary: #35A7FF;
            --accent: #FFD166;
            --success: #06D6A0;
            --dark: #2B2D42;
            --light: #F8F9FA;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .card {
            width: 90%;
            max-width: 750px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 35px;
            text-align: center;
            position: relative;
            border: 6px solid white;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px var(--accent);
        }

        .stage-badge {
            display: inline-block;
            background: var(--accent);
            color: #7A5C00;
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .scene-emoji {
            font-size: 5.5rem;
            margin: 10px 0;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 20px 0;
            font-weight: 700;
            color: #4A5568;
        }

        .question-box {
            background: #FFF9E6;
            border-left: 6px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #5C4300;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #2082d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: #2395ff;
            box-shadow: 0 9px 0 #186db4;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #186db4;
        }

        .btn-alt {
            background-color: var(--primary);
            box-shadow: 0 6px 0 #cc3944;
        }
        .btn-alt:hover {
            background-color: #ff424e;
            box-shadow: 0 9px 0 #a32b34;
        }

        .btn-success {
            background-color: var(--success);
            box-shadow: 0 6px 0 #049c73;
        }
        .btn-success:hover {
            background-color: #05b888;
            box-shadow: 0 9px 0 #037556;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <!-- El contenido interactivo se carga dinámicamente aquí -->
    </div>

    <!-- Generador de Sonidos Sintéticos Web API (Funciona sin internet y sin bloqueos) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'intriga') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        // Estructura de Escenas con Decisiones e Intriga
        const story = {
            inicio: {
                badge: "Escena 1: El Reto",
                title: "¡El Desafío en el Bosque!",
                emoji: "🐇💬🐢",
                text: "La liebre presumía todo el día de su gran velocidad, riéndose de lo lento que camina la tortuga. Cansada de las burlas, la tortuga la ha retado a una carrera.",
                question: "🤔 ¿Qué crees que debería hacer la tortuga para demostrar su valor?",
                options: [
                    { text: "🏁 Aceptar el reto de inmediato", next: "carrera_inicio", sound: "click", style: "" },
                    { text: "🤫 Ignorarla y seguir caminando sola", next: "final_silencio", sound: "intriga", style: "btn-alt" }
                ]
            },
            final_silencio: {
                badge: "Camino Alternativo",
                title: "El Poder del Silencio",
                emoji: "🌿🐢🌿",
                text: "La tortuga decidió no competir y seguir su propio camino con tranquilidad. La liebre se quedó sola presumiendo ante nadie. A veces, la mejor victoria es la paz mental.",
                question: "🌟 ¿Aprendimos algo nuevo?",
                options: [
                    { text: "🔄 Volver al inicio", next: "inicio", sound: "click", style: "btn-success" }
                ]
            },
            carrera_inicio: {
                badge: "Escena 2: ¡En sus marcas!",
                title: "¡Comienza la Carrera!",
                emoji: "🐻🚩🏃💨",
                text: "El oso grita: ¡En sus marcas, listos, YA! La liebre sale disparada como un rayo y deja a la tortuga muy atrás. Al mirar atrás, la liebre piensa que tiene la victoria asegurada.",
                question: "👀 La liebre ve un árbol fresco y tiene mucho sueño. ¿Qué decisión tomará?",
                options: [
                    { text: "🌳 Opción Clásica: Quedarse a dormir una siesta", next: "liebre_duerme", sound: "intriga", style: "btn-alt" },
                    { text: "⚡ Opción Misteriosa: Soportar el sueño y correr constante", next: "liebre_sin_parar", sound: "click", style: "btn-success" }
                ]
            },
            liebre_duerme: {
                badge: "Escena 3: El Descanso",
                title: "Zzz... ¡Ronquidos en el Bosque!",
                emoji: "😴🌳🐢",
                text: "La liebre se quedó profundamente dormida bajo la sombra. Mientras tanto, la tortuga avanza paso a paso, lenta pero sin pausa... ¡Y de pronto pasa junto a la liebre durmiendo!",
                question: "😱 ¿Qué debe hacer la tortuga al ver a la liebre roncando?",
                options: [
                    { text: "🤫 Pasar en silencio y seguir hacia la meta", next: "meta_clasica", sound: "win", style: "" },
                    { text: "👋 Despertarla amablemente para competir juntas", next: "meta_amigos", sound: "win", style: "btn-success" }
                ]
            },
            liebre_sin_parar: {
                badge: "Camino Alternativo",
                title: "¡Velocidad y Constancia!",
                emoji: "🏆🏃💨",
                text: "Al no detenerse a dormir, la liebre mantuvo un paso firme y cruzó la meta en primer lugar, aprendiendo a valorar el esfuerzo sin confiarse.",
                question: "🌟 ¡Excelente elección estratégica!",
                options: [
                    { text: "🔄 Jugar de nuevo", next: "inicio", sound: "click", style: "btn-success" }
                ]
            },
            meta_clasica: {
                badge: "Gran Final Clásico",
                title: "¡Victoria de la Tortuga!",
                emoji: "🎉🏆🐢",
                text: "¡La tortuga cruza la meta! Los gritos despiertan a la liebre, que no puede creer lo que ve. Moraleja: La constancia y la disciplina vencen a la vanidad.",
                question: "✨ ¿Te gustó este camino?",
                options: [
                    { text: "🔄 Volver a empezar", next: "inicio", sound: "click", style: "btn-success" }
                ]
            },
            meta_amigos: {
                badge: "Gran Final Cooperativo",
                title: "¡Cruzando de la Mano!",
                emoji: "🤝🌟🎉",
                text: "La tortuga despertó a la liebre. Ambas llegaron a la meta juntas, celebrando que el respeto y la amistad valen mucho más que ganar compitiendo.",
                question: "💖 ¡Un final lleno de empatía!",
                options: [
                    { text: "🔄 Volver a empezar", next: "inicio", sound: "click", style: "btn-success" }
                ]
            }
        };

        function renderScene(sceneKey) {
            const scene = story[sceneKey];
            const app = document.getElementById('app');

            let buttonsHTML = '';
            scene.options.forEach(opt => {
                let btnClass = 'btn ' + (opt.style || '');
                buttonsHTML += `<button class="${btnClass}" onclick="playSound('${opt.sound}'); renderScene('${opt.next}')">${opt.text}</button>`;
            });

            app.innerHTML = `
                <div class="stage-badge">${scene.badge}</div>
                <h1>${scene.title}</h1>
                <div class="scene-emoji">${scene.emoji}</div>
                <p>${scene.text}</p>
                <div class="question-box">${scene.question}</div>
                <div class="btn-container">
                    ${buttonsHTML}
                </div>
            `;
        }

        // Cargar la primera escena al abrir la página
        renderScene('inicio');
    </script>
</body>
</html>
