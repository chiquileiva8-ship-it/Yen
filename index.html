
   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Gran Desafío: Aventura con Vidas y Decisiones</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5964;
            --secondary: #35A7FF;
            --accent: #FFD166;
            --success: #06D6A0;
            --dark: #2B2D42;
            --light: #F8F9FA;
            --danger: #EF476F;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .story-card {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 35px;
            text-align: center;
            position: relative;
            border: 6px solid white;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F1F5F9;
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-family: 'Fredoka One', cursive;
        }

        .hearts {
            color: var(--danger);
            font-size: 1.3rem;
        }

        .help-btn {
            background: var(--accent);
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            font-size: 0.9rem;
            color: #7A5C00;
            box-shadow: 0 3px 0 #d4bc43;
            transition: all 0.1s;
        }
        .help-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d4bc43; }

        .chapter-tag {
            display: inline-block;
            background: var(--accent);
            color: #7A5C00;
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(255, 209, 102, 0.5);
        }

        .emoji-art {
            font-size: 4rem;
            margin: 10px 0;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .story-text {
            font-size: 1.1rem;
            line-height: 1.7;
            margin: 15px 0;
            font-weight: 700;
            color: #4A5568;
            text-align: justify;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .decision-box {
            background: #FFF9E6;
            border-left: 6px solid var(--accent);
            padding: 12px;
            border-radius: 12px;
            font-size: 1.05rem;
            margin: 15px 0;
            color: #5C4300;
            text-align: left;
            font-weight: 700;
        }

        .hint-box {
            background: #E0F7FA;
            border-left: 6px solid #00ACC1;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.95rem;
            margin: 10px 0;
            color: #006064;
            display: none;
            text-align: left;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #2082d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        .btn:hover { transform: translateY(-2px); background-color: #2395ff; box-shadow: 0 7px 0 #186db4; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #186db4; }
        .btn-alt { background-color: var(--primary); box-shadow: 0 5px 0 #cc3944; }
        .btn-alt:hover { background-color: #ff424e; box-shadow: 0 7px 0 #a32b34; }
        .btn-success { background-color: var(--success); box-shadow: 0 5px 0 #049c73; }
        .btn-success:hover { background-color: #05b888; box-shadow: 0 7px 0 #037556; }
    </style>
</head>
<body>

    <div class="story-card" id="app">
        <!-- Contenido dinámico -->
    </div>

    <script>
        // Estado del Juego (Vidas)
        let vidas = 3;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hurt') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.start(); osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        // Estructura de Escenas con gestión de vidas y pistas
        const story = {
            inicio: {
                tag: "Capítulo 1: El Desafío en el Prado",
                title: "Las Alardes de la Liebre",
                emoji: "🐇💬🐢",
                text: "Velox presume todo el día de su gran velocidad, riéndose de la tortuga Paciencia. Cansada de las burlas, la tortuga la reta a una carrera hasta la Colina de los Girasoles. Velox suelta una carcajada burlona.",
                hint: "💡 Pista del Búho: La soberbia y la prisa excesiva suelen nublar el buen juicio en una competencia larga.",
                question: "🤔 ¿Cómo decides iniciar tu preparación para la carrera?",
                options: [
                    { text: "🏁 Aceptar el reto confiando ciegamente en tu velocidad explosiva", next: "carrera_salida", sound: "click", damage: 0, style: "" },
                    { text: "🤭 Reírte en su cara y salir corriendo sin escuchar sus advertencias", next: "perder_vida_inicio", sound: "hurt", damage: 1, style: "btn-alt" }
                ]
            },
            perder_vida_inicio: {
                tag: "¡Cuidado! Perdiste una vida",
                title: "Falta de Respeto",
                emoji: "⚠️🐇💔",
                text: "Burlarse de los demás sin escuchar genera mal ambiente y te hace descuidar los detalles importantes del camino. ¡Has perdido un corazón por arrogancia!",
                hint: "💡 Pista: El respeto mutuo es el primer paso para cualquier reto importante.",
                question: "🔄 ¿Qué haces para enmendar tu actitud antes de empezar?",
                options: [
                    { text: "🏃‍♂️ Concentrarte en la carrera con más humildad", next: "carrera_salida", sound: "click", damage: 0, style: "btn-success" }
                ]
            },
            carrera_salida: {
                tag: "Capítulo 2: El Arranque",
                title: "¡En sus marcas, listos, YA!",
                emoji: "🐻🚩🏃💨",
                text: "El oso da la señal de salida. Velox sale disparada como un rayo, dejando a la tortuga muy atrás. Al mirar hacia atrás, Velox piensa que la tortuga no tiene ninguna oportunidad. El sol comienza a calentar con fuerza los senderos.",
                hint: "💡 Pista del Búho: Gastar toda la energía en los primeros metros sin medir el desgaste físico es un grave error táctico.",
                question: "👀 ¿Qué decisión tomas al correr a mitad del camino?",
                options: [
                    { text: "⚡ Seguir corriendo al máximo sin descansar ni hidratarse", next: "cansancio_extremo", sound: "hurt", damage: 1, style: "btn-alt" },
                    { text: "💧 Reducir un poco el ritmo y buscar un tramo fresco", next: "ritmo_constante", sound: "win", damage: 0, style: "btn-success" }
                ]
            },
            cansancio_extremo: {
                tag: "Capítulo 3: El Desgaste Físico",
                title: "¡Fatiga Muscular!",
                emoji: "🥵🪵💤",
                text: "Correr sin calentar ni medir tu esfuerzo ha sobrecalentado tus músculos. ¡Pierdes una vida por imprudencia física! Encuentras un gran roble milenario con una sombra muy tentadora.",
                hint: "💡 Pista del Búho: El descanso es necesario, pero dormir profundamente en medio de una competencia es un riesgo enorme.",
                question: "😴 ¿Qué haces bajo la sombra del roble?",
                options: [
                    { text: "🌳 Quedarte a dormir una siesta profunda y confiada", next: "sueno_profundo", sound: "hurt", damage: 1, style: "btn-alt" },
                    { text: "🌿 Estirar los músculos un minuto y seguir trotando despacio", next: "meta_estrategica", sound: "win", damage: 0, style: "btn-success" }
                ]
            },
            ritmo_constante: {
                tag: "Camino de Sabiduría",
                title: "Estrategia Inteligente",
                emoji: "📈🏃✨",
                text: "Al mantener un ritmo equilibrado, conservas energía y salud. Te encuentras con Paciencia, quien te saluda respetuosamente mientras avanza constante.",
                hint: "💡 Pista del Búho: La constancia vence a la velocidad desordenada.",
                question: "🌟 ¿Cómo abordas el tramo final hacia la colina?",
                options: [
                    { text: "🏁 Mantener el paso firme hasta cruzar la meta con honor", next: "meta_estrategica", sound: "win", damage: 0, style: "btn-success" }
                ]
            },
            sueno_profundo: {
                tag: "Capítulo 4: El Gran Descudio",
                title: "Zzz... ¡Ronquidos Profundos!",
                emoji: "😴🌳🐢",
                text: "Te quedaste dormida profundamente. La tortuga Paciencia caminó lento pero sin pausa, pasándote de largo mientras roncabas. Los gritos de la meta despiertan a los animales.",
                hint: "💡 Pista del Búho: La disciplina supera al talento cuando el talento decide dormir.",
                question: "😱 ¿Cómo reaccionas al despertar y ver que la tortuga está cerca de ganar?",
                options: [
                    { text: "🏃‍♀️ Correr desesperada intentando alcanzarla", next: "meta_clasica", sound: "hurt", damage: 0, style: "btn-alt" },
                    { text: "🤝 Aceptar la derrota con deportividad y felicitarla", next: "meta_amigos", sound: "win", damage: 0, style: "btn-success" }
                ]
            },
            meta_clasica: {
                tag: "Desenlace Clásico",
                title: "¡Victoria de la Tortuga!",
                emoji: "🎉🏆🐢",
                text: "Llegaste tarde a la meta. Moraleja: Ten una buena actitud y no te burles de los demás. Puedes ser más exitoso haciendo las cosas con constancia y disciplina que actuando rápida y descuidadamente.",
                question: "✨ ¿Quieres aprender de tus errores y volver a jugar?",
                options: [
                    { text: "🔄 Reiniciar aventura (Restaurar vidas)", next: "reiniciar", sound: "click", damage: 0, style: "btn-success" }
                ]
            },
            meta_estrategica: {
                tag: "Desenlace Victorioso",
                title: "¡Triunfo con Inteligencia!",
                emoji: "🌟🏆🏃",
                text: "¡Felicidades! Ganaste la carrera combinando velocidad, estrategia y disciplina, cuidando tus recursos sin caer en la soberbia.",
                question: "✨ ¡Excelente trabajo pedagógico!",
                options: [
                    { text: "🔄 Volver a jugar", next: "reiniciar", sound: "click", style: "btn-success" }
                ]
            },
            meta_amigos: {
                tag: "Desenlace Cooperativo",
                title: "¡Empatía en el Bosque!",
                emoji: "💖🤝🎉",
                text: "Demostraste gran madurez al reconocer el esfuerzo de tu compañera. Las dos cruzaron unidas los últimos metros, celebrando el respeto mutuo.",
                question: "✨ ¡Un final lleno de valores socioemocionales!",
                options: [
                    { text: "🔄 Volver a jugar", next: "reiniciar", sound: "click", style: "btn-success" }
                ]
            },
            game_over: {
                tag: "¡Juego Terminado!",
                title: "Te has quedado sin vidas",
                emoji: "💀💔🌲",
                text: "La imprudencia, la soberbia y el agotamiento extremo te han vencido en el camino. Recuerda que en la educación y en la vida, la constancia y el cuidado personal son fundamentales.",
                hint: "💡 Pista final: Analiza cada decisión antes de actuar con prisa.",
                question: "🔄 ¿Deseas intentarlo de nuevo con una nueva estrategia?",
                options: [
                    { text: "❤️ Reintentar la aventura desde el inicio", next: "reiniciar", sound: "win", damage: 0, style: "btn-success" }
                ]
            }
        };

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function renderScene(sceneKey, damage = 0) {
            // Manejo de Vidas
            if (sceneKey === 'reiniciar') {
                vidas = 3;
                renderScene('inicio');
                return;
            }

            vidas -= damage;
            if (vidas <= 0) {
                sceneKey = 'game_over';
                vidas = 0;
            }

            const scene = story[sceneKey];
            const app = document.getElementById('app');

            let heartsHTML = '❤️'.repeat(vidas) + '🤍'.repeat(3 - vidas);

            let buttonsHTML = '';
            scene.options.forEach(opt => {
                let btnClass = 'btn ' + (opt.style || '');
                buttonsHTML += `<button class="${btnClass}" onclick="playSound('${opt.sound}'); renderScene('${opt.next}', ${opt.damage})">${opt.text}</button>`;
            });

            app.innerHTML = `
                <div class="hud">
                    <div class="hearts">Vidas: ${heartsHTML}</div>
                    <button class="help-btn" onclick="toggleHint()">🦉 Ayuda del Búho</button>
                </div>
                <div class="chapter-tag">${scene.tag}</div>
                <h1>${scene.title}</h1>
                <div class="emoji-art">${scene.emoji}</div>
                <div class="story-text">${scene.text}</div>
                <div class="hint-box" id="hint-box">${scene.hint}</div>
                <div class="decision-box">${scene.question}</div>
                <div class="btn-group">
                    ${buttonsHTML}
                </div>
            `;
        }

        // Inicializar al cargar
        renderScene('inicio', 0);
    </script>
</body>
</html>
