<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Gran Desafío de Velox y Paciencia</title>
    <!-- Fuentes infantiles amigables -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5964;
            --secondary: #35A7FF;
            --accent: #FFD166;
            --success: #06D6A0;
            --dark: #2B2D42;
            --light: #F8F9FA;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .story-card {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 40px;
            text-align: center;
            position: relative;
            border: 6px solid white;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .chapter-tag {
            display: inline-block;
            background: var(--accent);
            color: #7A5C00;
            padding: 6px 18px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(255, 209, 102, 0.5);
        }

        .emoji-art {
            font-size: 5rem;
            margin: 15px 0;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .story-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin: 20px 0;
            font-weight: 700;
            color: #4A5568;
            text-align: justify;
        }

        .decision-box {
            background: #FFF9E6;
            border-left: 6px solid var(--accent);
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            margin: 25px 0 15px 0;
            color: #5C4300;
            text-align: left;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 1.15rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #2082d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: #2395ff;
            box-shadow: 0 9px 0 #186db4;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #186db4;
        }

        .btn-alt {
            background-color: var(--primary);
            box-shadow: 0 6px 0 #cc3944;
        }
        .btn-alt:hover {
            background-color: #ff424e;
            box-shadow: 0 9px 0 #a32b34;
        }

        .btn-success {
            background-color: var(--success);
            box-shadow: 0 6px 0 #049c73;
        }
        .btn-success:hover {
            background-color: #05b888;
            box-shadow: 0 9px 0 #037556;
        }
    </style>
</head>
<body>

    <div class="story-card" id="app">
        <!-- El contenido interactivo se renderiza aquí -->
    </div>

    <!-- Script con la lógica del cuento y sonidos web estables -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'decision') {
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        // Estructura de Escenas Literarias e Interactivas
        const story = {
            inicio: {
                tag: "Parte 1: El Reto en el Bosque",
                title: "El Orgullo de la Liebre",
                emoji: "🐇💬🐢",
                text: "Había una vez, en un rincón muy verde del Bosque del Arroyo Fresco, una liebre llamada Velox que se pasaba el día presumiendo de su gran velocidad. Cansada de sus constantes alardes, la tortuga Paciencia la retó a competir en una carrera hasta la Colina de los Girasoles. Velox soltó una carcajada burlona, mientras Paciencia respondió firme: 'Guarda tus palabras hasta después de la carrera'.",
                question: "🤔 ¿Cómo decides que inicie la aventura?",
                options: [
                    { text: "🏁 Aceptar el reto y dar la salida oficial", next: "carrera", sound: "click", style: "" },
                    { text: "🌿 Tomar un camino alternativo de reflexión en silencio", next: "camino_silencio", sound: "decision", style: "btn-alt" }
                ]
            },
            camino_silencio: {
                tag: "Camino Alternativo",
                title: "El Valor de la Paciencia",
                emoji: "🌿🐢🌿",
                text: "Paciencia decidió que las burlas no merecían su energía. Siguió su camino en paz, demostrando que no siempre hay que competir para demostrar valía. La liebre se quedó sola presumiendo ante nadie.",
                question: "🌟 ¡Una gran lección sobre la autoestima!",
                options: [
                    { text: "🔄 Volver al inicio de la historia", next: "inicio", sound: "win", style: "btn-success" }
                ]
            },
            carrera: {
                tag: "Parte 2: El Arranque",
                title: "¡En sus marcas, listos, YA!",
                emoji: "🐻🚩🏃💨",
                text: "Al día siguiente, los animales del bosque se reunieron. El oso dio la señal de salida. La liebre salió disparada como un rayo, dejando a la tortuga muy atrás. Mirando hacia atrás con soberbia, Velox pensó: '¿Por qué habrá querido competir si no tiene ninguna oportunidad?'. Confiada en su victoria, llegó a la mitad del camino y vio un gran árbol con una sombra muy fresca.",
                question: "👀 La liebre siente mucho sueño y calor. ¿Qué camino elegirá la historia?",
                options: [
                    { text: "🌳 Opción Clásica: Quedarse a dormir una larga siesta", next: "sueno_profundo", sound: "decision", style: "btn-alt" },
                    { text: "⚡ Opción Estratégica: Continuar trotando a ritmo constante sin parar", next: "ritmo_constante", sound: "click", style: "btn-success" }
                ]
            },
            ritmo_constante: {
                tag: "Camino Alternativo",
                title: "Constancia sin Excesos",
                emoji: "🏃✨🏆",
                text: "Sabiendo que la confianza es peligrosa, Velox mantuvo un trote moderado. Alcanzó a la tortuga, ambas se saludaron con respeto y terminaron trotando juntas, demostrando que la disciplina gana sin necesidad de descuidos.",
                question: "🌟 ¡Excelente elección de estrategia!",
                options: [
                    { text: "🔄 Volver a empezar", next: "inicio", sound: "win", style: "btn-success" }
                ]
            },
            sueno_profundo: {
                tag: "Parte 3: El Descanso",
                title: "Zzz... ¡Ronquidos bajo el Sol!",
                emoji: "😴🌳🐢",
                text: "La liebre se recostó bajo el roble y se quedó profundamente dormida. Mientras tanto, la tortuga siguió caminando lento, pero sin pausa, decidida a no rendirse. Pronto, pasó silenciosamente junto a la liebre que roncaba plácidamente. ¡La tortuga estaba tomando la delantera!",
                question: "😱 ¿Qué debe hacer la tortuga al acercarse a la meta final?",
                options: [
                    { text: "🤫 Cruzar la meta en silencio y ganar la carrera", next: "meta_clasica", sound: "win", style: "" },
                    { text: "🤝 Detenerse a despertar a la liebre para terminar juntas", next: "meta_amigos", sound: "win", style: "btn-success" }
                ]
            },
            meta_clasica: {
                tag: "Desenlace Clásico",
                title: "¡Victoria de la Tortuga!",
                emoji: "🎉🏆🐢",
                text: "Los gritos de emoción de los animales despertaron a la liebre. Velox abrió los ojos y vio a la tortuga cruzando la meta. Había perdido por confiada. Moraleja: Ten una buena actitud, no te burles de los demás y sé más exitoso mediante la constancia y la disciplina que con acciones rápidas y descuidadas.",
                question: "✨ ¿Qué camino deseas explorar ahora?",
                options: [
                    { text: "🔄 Volver al inicio", next: "inicio", sound: "click", style: "btn-success" }
                ]
            },
            meta_amigos: {
                tag: "Desenlace Cooperativo",
                title: "¡Cruzando de la Mano!",
                emoji: "🤝🌟🎉",
                text: "La tortuga decidió despertar a su compañera. Ambas llegaron a la meta juntas, compartiendo los aplausos del bosque. Aprendieron que el respeto, la empatía y el esfuerzo conjunto valen mucho más que una medalla individual.",
                question: "💖 ¡Un final lleno de valores y compañerismo!",
                options: [
                    { text: "🔄 Volver al inicio", next: "inicio", sound: "click", style: "btn-success" }
                ]
            }
        };

        function renderScene(sceneKey) {
            const scene = story[sceneKey];
            const app = document.getElementById('app');

            let buttonsHTML = '';
            scene.options.forEach(opt => {
                let btnClass = 'btn ' + (opt.style || '');
                buttonsHTML += `<button class="${btnClass}" onclick="playSound('${opt.sound}'); renderScene('${opt.next}')">${opt.text}</button>`;
            });

            app.innerHTML = `
                <div class="chapter-tag">${scene.tag}</div>
                <h1>${scene.title}</h1>
                <div class="emoji-art">${scene.emoji}</div>
                <div class="story-text">${scene.text}</div>
                <div class="decision-box">${scene.question}</div>
                <div class="btn-group">
                    ${buttonsHTML}
                </div>
            `;
        }

        // Inicializar la primera escena
        renderScene('inicio');
    </script>
</body>
</html>
